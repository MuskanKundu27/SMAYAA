name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
      ENVIRONMENT: test
      TEST_DATABASE_URL: postgresql+psycopg://smayaa_app:app_ci_pw@localhost:5432/smayaa_test
      MIGRATION_DATABASE_URL: postgresql+psycopg://smayaa_owner:owner_ci_pw@localhost:5432/smayaa_test
      JWT_SECRET: ci-only-secret-that-is-at-least-32-characters-long
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy app tests migrations
      - name: Create database roles
        run: psql -h localhost -U postgres -v owner_pw=owner_ci_pw -v app_pw=app_ci_pw -f scripts/create_dev_db.sql
      - name: Migrate
        run: alembic upgrade head
      - name: Test
        run: pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  docker:
    # Local development does not use Docker yet; this job keeps the Dockerfiles buildable.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t smayaa-api ./api
      - run: docker build -t smayaa-web ./web
