# SMAYAA site for servers that already run nginx. setup-server.sh replaces __HOST__ and
# __API_PORT__, installs it as /etc/nginx/sites-available/smayaa, then certbot adds HTTPS
# and the HTTP -> HTTPS redirect to this server block only.

server {
    listen 80;
    listen [::]:80;
    server_name __HOST__;

    root /var/www/smayaa;
    client_max_body_size 2m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # The API runs locally and is never exposed directly.
    location /api/ {
        proxy_pass http://127.0.0.1:__API_PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single-page app: unknown paths load index.html and React decides what to show.
    location / {
        try_files $uri /index.html;
    }

    access_log /var/log/nginx/smayaa.access.log;
    error_log /var/log/nginx/smayaa.error.log;
}
